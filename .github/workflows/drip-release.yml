name: Drip posting release, sourcing checks and CJ order tracking

# Vercel's free (Hobby) plan only allows daily cron jobs, so this free GitHub
# schedule calls the release endpoint about once an hour instead.
# Needs the repository secret CRON_SECRET (same value as the Vercel env var).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip quietly until drip posting is switched on
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET is not set; nothing to release."

      - name: Release scheduled listings
        if: env.CRON_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ebay-autopilot.vercel.app/api/cron/release

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip quietly until scheduled jobs are switched on
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET is not set; nothing to check."

      - name: Find and check products for sellers' niches
        if: env.CRON_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ebay-autopilot.vercel.app/api/cron/source

  fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip quietly until scheduled jobs are switched on
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET is not set; nothing to check."

      - name: Check CJ orders and send tracking to eBay
        if: env.CRON_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ebay-autopilot.vercel.app/api/cron/fulfillment
